[build]
  command = "npm run build"
  publish = "dist"

# 北の手 · Kita no Te: the magazine moved from its first preview URLs to the
# channel's address on the business card and QR code.
[[redirects]]
  from = "/hender-fra-nord"
  to = "/kitanote/no"
  status = 301
  force = true

[[redirects]]
  from = "/hender-fra-nord/*"
  to = "/kitanote/no/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/hands-of-the-north"
  to = "/kitanote/en"
  status = 301
  force = true

[[redirects]]
  from = "/en/hands-of-the-north/*"
  to = "/kitanote/en/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.stripe.com https://api.resend.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none';"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-store"
