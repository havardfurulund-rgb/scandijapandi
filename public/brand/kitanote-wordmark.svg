<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kita no Te — 北の手">
  <!--
    Kita no Te / 北の手 — wordmark v1
    Original design for Scandi Japandi Collection (SKM Nordic AS).
    Mark: two horizontal strokes (north / the horizon) crossed by one
    vertical hand-drawn stroke (the hand, the maker). Nothing else.
    Colours: ink #1A1A1A on paper #FBFBFA. Accent clay #A37B65 only for the dot.
  -->
  <rect width="1200" height="320" fill="#FBFBFA"/>

  <!-- Mark -->
  <g transform="translate(90,70)" fill="none" stroke="#1A1A1A" stroke-linecap="round">
    <!-- horizon strokes: "north" -->
    <path d="M0 62 H180" stroke-width="7"/>
    <path d="M0 122 H180" stroke-width="7"/>
    <!-- the hand: one deliberate vertical stroke, slightly off-centre, tapering -->
    <path d="M118 8 C116 60 114 120 118 178" stroke-width="11"/>
    <!-- the maker's mark -->
    <circle cx="20" cy="178" r="7" fill="#A37B65" stroke="none"/>
  </g>

  <!-- Japanese primary -->
  <text x="340" y="150" font-family="'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif" font-size="96" font-weight="400" fill="#1A1A1A" letter-spacing="14">北の手</text>

  <!-- Latin secondary -->
  <text x="344" y="215" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="300" fill="#1A1A1A" letter-spacing="10">KITA NO TE</text>

  <!-- Descriptor -->
  <text x="346" y="258" font-family="Jost, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#706E6B" letter-spacing="5">HANDS FROM THE NORTH · PRESENTED BY SCANDI JAPANDI COLLECTION</text>
</svg>
