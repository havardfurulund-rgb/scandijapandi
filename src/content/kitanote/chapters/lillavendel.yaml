dek:
  ja: ヴェストフォル県ヘルゲロア（Helgeroa）で、グーロ・リムスタさんが石けんとキャンドル、農場の品をつくっています。
  en: In Helgeroa, Vestfold, Guro Rimstad makes soap, candles and farm goods.
  no: I Helgeroa i Vestfold lager Guro Rimstad såper, lys og gårdsprodukter.
body:
  ja: |-
    リラヴェンデル（Lillavendel）では、仕事の速さを決めるのは農場です。道具は、手と鼻です。

    この章では、グーロさんの一日を、原料から石けんとキャンドルができあがるまで追います。
  en: |-
    At Lillavendel the farm sets the pace. The tools are hands and nose.

    This chapter follows Guro through a working day, from raw material to finished soap and candle.
  no: |-
    Hos Lillavendel er det gården som setter tempoet. Redskapene er hendene og nesen.

    Kapitlet følger Guro gjennom en arbeidsdag, fra råvare til ferdig såpe og lys.
interview:
  - q:
      ja: リラヴェンデルは、どのように始まりましたか。
      en: How did Lillavendel begin?
      no: Hvordan begynte Lillavendel?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。始まりと、その場所について。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the beginning, and about the place."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om begynnelsen, og om stedet."
  - q:
      ja: よい石けんとは、どのようなものですか。
      en: What makes a good soap?
      no: Hva gjør en god såpe?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。原料と時間、目に見えない小さな選択について。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about ingredients, time and the small choices that don’t show."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om råvarer, tid og de små valgene som ikke synes."
  - q:
      ja: 農場での普段の一日は、どのようなものですか。
      en: What does an ordinary day on the farm look like?
      no: Hvordan ser en vanlig dag ut på gården?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。一年のリズムについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the rhythm of the year."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om rytmen gjennom året."
quotes:
