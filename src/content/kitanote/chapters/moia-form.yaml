dek:
  ja: ルビー・セムさんのモイア・フォルム（MOIA form）は、ウールのブランケットとシートパッド、ホーローのマグ、キッチンテキスタイルをつくっています。
  en: Ruby Semb and MOIA form make wool throws, seat pads, enamel mugs and kitchen textiles.
  no: Ruby Semb og MOIA form lager ullpledd, sitteunderlag, emaljekrus og kjøkkentekstiler.
body:
  ja: |-
    ソファに掛けたブランケット。いつも出しておくマグ。涼しい夜、玄関の段に敷くシートパッド。毎日、手に触れるものです。

    この章では、モイア・フォルムのかたちと色、その背景にある考えを見ていきます。
  en: |-
    A throw over the back of the sofa. A mug that is always left out. A seat pad on the steps on a cool evening. Things that are handled every day.

    This chapter looks at MOIA form’s shapes, colours and the thinking behind them.
  no: |-
    Et pledd over sofaryggen. Et krus som alltid står fremme. Et sitteunderlag på trappen en kjølig kveld. Ting som er i hendene hver dag.

    Kapitlet ser på formene, fargene og tanken bak MOIA form.
interview:
  - q:
      ja: 最初につくったものは何ですか。
      en: What was the first thing you made?
      no: Hva var det første du laget?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。モイア・フォルムの始まりについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the origins of MOIA form."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om opprinnelsen til MOIA form."
  - q:
      ja: 色は、どのように選びますか。
      en: How do you choose colours?
      no: Hvordan velger du farger?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。色の組み合わせ、光、季節について。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about palette, light and seasons."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om palett, lys og årstider."
  - q:
      ja: ご自身がいちばんよく使うものは何ですか。
      en: Which object do you use most yourself?
      no: Hvilket objekt bruker du mest selv?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。家でいちばん使うものについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the favourite at home."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om favoritten hjemme."
