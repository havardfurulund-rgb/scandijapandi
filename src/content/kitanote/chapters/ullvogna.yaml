dek:
  ja: ウルヴォグナ（Ullvogna）は、ウール100％の製品をつくっています。掲げている言葉は「私たちが、あなたを暖めます」です。
  en: Ullvogna makes goods in one hundred per cent pure wool. Their line is “We keep you warm”.
  no: Ullvogna lager produkter i hundre prosent ren ull. Løftet deres er «Vi holder dere varme».
body:
  ja: |-
    ウールは、もっとも古い素材のひとつです。呼吸をし、湿っていても暖かく、長い年月の使用に耐えます。

    ウルヴォグナが使うのは、純粋なウールだけです。この章では、繊維から一枚の服になるまでを追います。
  en: |-
    Wool is one of the oldest materials we have. It breathes, stays warm when damp and lasts for years of use.

    Ullvogna works only in pure wool. This chapter follows the work from fibre to finished piece.
  no: |-
    Ull er et av de eldste materialene vi har. Den puster, varmer også når den er fuktig, og tåler mange år med bruk.

    Ullvogna bruker bare ren ull. Kapitlet følger arbeidet fra fiber til ferdig plagg.
interview:
  - q:
      ja: 「私たちが、あなたを暖めます」という言葉には、どんな意味がありますか。
      en: What does “We keep you warm” mean to you?
      no: Hva betyr «Vi holder dere varme» for dere?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。言葉の裏にある約束について、二文から四文ほど。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: two to four sentences about the promise behind the words."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: to til fire setninger om løftet bak ordene."
  - q:
      ja: なぜ純粋なウールだけを使うのですか。
      en: Why only pure wool?
      no: Hvorfor bare ren ull?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。素材の選び方と、ほかに何も混ぜないことについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the choice of material, and what happens when nothing else is blended in."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om materialvalget, og hva som skjer når man ikke blander inn noe annet."
  - q:
      ja: ウールの服は、どのように手入れをすればよいですか。
      en: How should a wool piece be cared for?
      no: Hvordan bør et ullplagg stelles?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。風に当てること、あまり洗わないこと、待つことについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: airing, little washing and patience."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: lufting, lite vask og tålmodighet."
quotes:
