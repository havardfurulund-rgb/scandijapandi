dek:
  ja: アルヴァダール（Alvadal）のマグヌスさんは、スウェーデンで木のまな板をつくっています。まな板には生涯保証がついています。
  en: Magnus at Alvadal makes wooden cutting boards in Sweden, with a lifetime warranty.
  no: Magnus i Alvadal lager skjærefjøler i tre i Sverige, med livstidsgaranti.
body:
  ja: |-
    まな板は、オイルで手入れをしながら、長く台所で使う道具です。

    この章では、スウェーデンのアルヴァダールを訪ね、一枚の板ができるまでと、その手入れの方法を見ます。
  en: |-
    A cutting board is a tool that is cared for with oil and stays in a kitchen for many years.

    This chapter visits Alvadal in Sweden to see how a board is made, and how it is cared for.
  no: |-
    En skjærefjøl er et redskap som stelles med olje og blir i et kjøkken i mange år.

    Kapitlet besøker Alvadal i Sverige og ser hvordan et brett blir til, og hvordan det stelles.
interview:
  - q:
      ja: なぜ生涯保証をつけるのですか。
      en: Why offer a lifetime warranty?
      no: Hvorfor gi livstidsgaranti?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。約束と、それにともなう責任について。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the promise, and the responsibility that comes with it."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om løftet, og om ansvaret som følger med."
  - q:
      ja: 木は、どのように選びますか。
      en: How do you choose the wood?
      no: Hvordan velger du treet?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。木の種類と木目、手が最初に感じることについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about species, grain and what the hands notice first."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om tresorter, fiberretning og hva hendene merker først."
  - q:
      ja: まな板は、どのように手入れをしますか。
      en: How should a board be cared for?
      no: Hvordan stelles et brett?
    a:
      ja: "［仮］作り手自身の答えは、インタビューの後に入ります。紙面のリズムを確かめるため、実際に近い長さにしています。オイルと乾燥、急がないことについて。"
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about oil, drying and calm."
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om olje, tørking og ro."
