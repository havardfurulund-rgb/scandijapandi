  body:
    ja: |-
      日本には、北欧デザインの写真がたくさんあります。けれど、作り手の声はほとんど届いていません。

      北の手は、北欧の作り手をその工房に訪ねる記録です。質問は画面の外からします。話すのは作り手です。その言葉に、日本語の字幕をつけてお届けします。

      第一号では、ノルウェーとスウェーデンの四つの工房を訪ねます。ウール、ラベンダー、木、ホーロー。それぞれの場所で、ものがどのように生まれるのかを記録しました。

      各章の終わりには、その回に登場した作品を載せています。
    en: |-
      There are a thousand pictures of Nordic design in Japan. There are almost no voices.

      Kita no Te visits Nordic makers in their own workshops. The questions are asked from behind the camera, and the maker speaks. Their words are subtitled in Japanese.

      This first issue visits four workshops in Norway and Sweden: wool, lavender, wood and enamel. In each place we record how things are made.

      At the end of each chapter are the objects from that episode.
    no: |-
      Det finnes tusen bilder av nordisk design i Japan. Det finnes nesten ingen stemmer.

      Kita no Te besøker nordiske håndverkere i deres egne verksteder. Spørsmålene stilles utenfor bildet, og håndverkeren snakker. Ordene tekstes på japansk.

      Dette første nummeret besøker fire verksteder i Norge og Sverige: ull, lavendel, tre og emalje. På hvert sted ser vi hvordan tingene blir til.

      Nederst i hvert kapittel står objektene fra episoden.
