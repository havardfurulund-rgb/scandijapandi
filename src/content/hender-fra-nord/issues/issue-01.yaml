  title:
    no: Om hender, og det de husker
    en: On hands, and what they remember
  body:
    no: |-
      Dette nummeret begynte med et enkelt spørsmål: hva skjer i rommet før et objekt blir et produkt? Svaret ligger sjelden i en katalog. Det ligger i verksteder, på gårder og ved kjøkkenbord, hos mennesker som har valgt å gjøre ting langsomt.

      Hender fra Nord er et forsøk på å sakke ned sammen med dem. Filmene er korte og rolige, og vi har latt lyden av arbeidet få plass. Hvert kapittel er et besøk hos én maker, i deres eget rom og i deres eget tempo.

      Noe av det du ser her finner etter hvert veien til butikken vår. Det meste er bare ment å bli sett, og kanskje husket.

      Takk til makerne som åpner dørene sine. Og takk til deg som tar deg tid.
    en: |-
      This issue began with a simple question: what happens in the room before an object becomes a product? The answer is rarely found in a catalogue. It lives in workshops, on farms and at kitchen tables, with people who have chosen to make things slowly.

      Hands of the North is an attempt to slow down alongside them. The films are short and quiet, and we have let the sound of the work take up space. Each chapter is a visit to one maker, in their own room and at their own pace.

      Some of what you see here will find its way into our shop in time. Most of it is simply meant to be seen, and perhaps remembered.

      Thank you to the makers who open their doors. And thank you for taking the time.
