  no: Hverdagens myke ting
  en: The soft things of every day
dek:
  no: Ruby Semb og MOIA form lager ullpledd, sitteunderlag, emaljekrus og kjøkkentekstiler. Om tingene vi lever tettest på.
  en: Ruby Semb and MOIA form make wool throws, seat pads, enamel mugs and kitchen textiles. On the things we live closest to.
body:
  no: |-
    Et pledd over sofaryggen. Et krus som alltid står fremme. Et sitteunderlag på trappen en kjølig kveld. Det er de små tingene som gjør et rom til et hjem.

    MOIA form lager nettopp slike ting. I dette kapitlet ser vi på formene, fargene og tanken bak.
  en: |-
    A throw over the back of the sofa. A mug that is always left out. A seat pad on the steps on a cool evening. It is the small things that turn a room into a home.

    MOIA form makes exactly these things. In this chapter we look at the shapes, the colours and the thinking behind them.
