dek:
  no: I Helgeroa i Vestfold lager Guro Rimstad såper, lys og gårdsprodukter. Et kapittel om duft, tålmodighet og ting som tar den tiden de tar.
  en: In Helgeroa, Vestfold, Guro Rimstad makes soaps, candles and farm goods. A chapter about scent, patience and things that take the time they take.
body:
  no: |-
    Noen produkter blir til i en maskin. Andre blir til i et kjøkken, over tid, med hendene og nesen som viktigste redskap.

    Hos Lillavendel er det gården som setter tempoet. Vi følger Guro gjennom en arbeidsdag, fra råvare til ferdig såpe og lys.
  en: |-
    Some products are made by a machine. Others are made in a kitchen, over time, with hands and nose as the most important tools.

    At Lillavendel the farm sets the pace. We follow Guro through a working day, from raw material to finished soap and candle.
