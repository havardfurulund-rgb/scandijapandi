      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about ingredients, time and the small choices that don’t show."
  - q: { no: Hvordan ser en vanlig dag ut på gården?, en: What does an ordinary day on the farm look like? }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om rytmen gjennom året."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the rhythm of the year."
