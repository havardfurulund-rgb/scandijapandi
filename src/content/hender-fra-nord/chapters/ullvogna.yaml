title:
  no: Varme som varer
  en: Warmth that lasts
dek:
  no: Ullvogna lager produkter i hundre prosent ren ull, under et løfte som er like enkelt som det er stort. Vi holder dere varme.
  en: Ullvogna makes things in one hundred per cent pure wool, under a promise as simple as it is large. We keep you warm.
body:
  no: |-
    Ull er et av de eldste materialene vi har, og fortsatt et av de mest gjennomtenkte. Den puster, den varmer når den er fuktig, og den tåler år med bruk.

    Ullvogna har bygget arbeidet sitt rundt ren ull, uten snarveier. I dette kapitlet ser vi nærmere på hva det betyr i praksis, fra fiber til ferdig plagg.
  en: |-
    Wool is one of the oldest materials we have, and still one of the most considered. It breathes, it warms even when damp, and it endures years of use.

    Ullvogna has built its work around pure wool, without shortcuts. In this chapter we look at what that means in practice, from fibre to finished piece.
interview:
  - q: { no: "Hva betyr «Vi holder dere varme» for dere?", en: "What does “We keep you warm” mean to you?" }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: to til fire setninger om løftet bak ordene."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: two to four sentences about the promise behind the words."
  - q: { no: Hvorfor bare ren ull?, en: Why only pure wool? }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om materialvalget, og hva som skjer når man ikke blander inn noe annet."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the choice of material, and what happens when nothing else is blended in."
  - q: { no: Hvordan bør et ullplagg stelles?, en: How should a wool piece be cared for? }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: lufting, lite vask og tålmodighet."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: airing, little washing and patience."
quotes:
  - text:
      no: "[utkast] Ull er tålmodig. Den venter på at du skal trenge den."
      en: "[draft] Wool is patient. It waits until you need it."
