title:
  no: Et brett for et helt liv
  en: A board for a lifetime
dek:
  no: Magnus i Alvadal lager skjærefjøler i tre, med livstidsgaranti. Om et redskap som stelles med olje og er laget for å følge et kjøkken i mange år.
  en: Magnus at Alvadal makes wooden cutting boards with a lifetime warranty. On a tool that is cared for with oil and made to stay with a kitchen for many years.
body:
  no: |-
    En livstidsgaranti er et uvanlig løfte å gi for noe vi bruker hver dag. Den sier noe om materialet, og enda mer om den som lager det.

    I dette kapitlet besøker vi Alvadal i Sverige, og ser hvordan et brett blir til, og hvordan det stelles slik at det varer.
  en: |-
    A lifetime warranty is an unusual promise to make for something we use every day. It says something about the material, and even more about the person who makes it.

    In this chapter we visit Alvadal in Sweden, to see how a board comes into being, and how it is cared for so that it lasts.
interview:
  - q: { no: Hvorfor gi livstidsgaranti?, en: Why offer a lifetime warranty? }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om løftet, og om ansvaret som følger med."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about the promise, and the responsibility that comes with it."
  - q: { no: Hvordan velger du treet?, en: How do you choose the wood? }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om tresorter, fiberretning og hva hendene merker først."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about species, grain and what the hands notice first."
  - q: { no: Hvordan stelles et brett?, en: How should a board be cared for? }
    a:
      no: "[utkast] Plassholder. Makerens eget svar skrives inn etter intervjuet. Teksten har omtrent riktig lengde, slik at rytmen i oppslaget kan vurderes: om olje, tørking og ro."
      en: "[draft] Placeholder. The maker’s own answer is added after the interview. The text is roughly the right length so the rhythm of the spread can be judged: about oil, drying and calm."
quotes:
  - text:
      no: "[utkast] Et godt brett blir vakrere for hvert år det brukes."
      en: "[draft] A good board grows more beautiful with every year of use."
